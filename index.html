<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16100C">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>AURE · Control de Oro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: libro de joyería — barra de marca arriba, pestañas como separadores de archivo, contenido en hojas claras sobre fondo arena */
:root{
  --bg:#F5F1EB; --surface:#FFFDF9; --sunk:#EFE8DE; --ink:#2A201A; --muted:#76665A; --line:#E3D8CA;
  --gold:#9C772E; --gold-mark:#B58D3D; --sand:#C4B19C; --butano:#5C4233; --on-gold:#FFFDF9;
  --ok:#3C7350; --ok-bg:#E3EFE6; --warn:#9A6516; --warn-bg:#F6EAD5; --bad:#9E3B33; --bad-bg:#F5E1DE;
  --f-display:"Gilda Display","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Manrope","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16100C; --surface:#201812; --sunk:#2A2019; --ink:#F1E7DB; --muted:#B4A290; --line:#3A2D23;
  --gold:#D4AC5E; --gold-mark:#C9A04E; --sand:#8C7A66; --butano:#E2CDB6; --on-gold:#1A120D;
  --ok:#8BC69C; --ok-bg:#1E3125; --warn:#E3B062; --warn-bg:#3A2A12; --bad:#EE958B; --bad-bg:#3D1F1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16100C; --surface:#201812; --sunk:#2A2019; --ink:#F1E7DB; --muted:#B4A290; --line:#3A2D23;
  --gold:#D4AC5E; --gold-mark:#C9A04E; --sand:#8C7A66; --butano:#E2CDB6; --on-gold:#1A120D;
  --ok:#8BC69C; --ok-bg:#1E3125; --warn:#E3B062; --warn-bg:#3A2A12; --bad:#EE958B; --bad-bg:#3D1F1B; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* header */
.brand{display:flex;align-items:center;gap:14px;padding-block:22px 14px;flex-wrap:wrap}
.brand svg{width:54px;height:46px;flex:none}
.brand .wm{font-family:var(--f-display);font-size:28px;letter-spacing:.42em;line-height:1}
.brand .tag{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.brand .right{margin-left:auto;min-width:0;max-width:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rate{display:flex;flex-wrap:wrap;row-gap:4px;max-width:100%;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font-size:12.5px;cursor:pointer}
.rate b{font-weight:700}
.rate span{white-space:nowrap}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 16px;font:600 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold-mark)}
.banner{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);font-size:13px}
main{padding-top:22px}
.head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:30px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* controls */
button,.btn{font:600 13px var(--f-body);border-radius:var(--r);padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-danger[data-armed]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold-mark);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f small{text-transform:none;letter-spacing:0;font-weight:500}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:720px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:600px){.kpis.k3{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--surface);padding:16px 18px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--f-display);font-size:27px;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.alert .v{color:var(--bad)}
.section{margin-top:28px}
.section h3{font-size:21px;margin-bottom:10px}
/* panels & tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--sunk)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.code{white-space:nowrap;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--gold)}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:99px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}
.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-bad{background:var(--bad-bg);color:var(--bad)}
.c-n{background:var(--sunk);color:var(--muted)}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}
.empty p{max-width:52ch;margin:0 auto 14px}
/* client cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;color:inherit}
.ccard:hover{border-color:var(--sand)}
.ccard .n{font-family:var(--f-display);font-size:19px}
.ccard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
/* tarifa */
.tarifa-box{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.tarifa-box{grid-template-columns:minmax(0,1fr)}}
.tarifa-box .panel{padding:20px}
.ratecard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);margin-top:14px}
.ratecard div{background:var(--sunk);padding:12px}
.ratecard .eyebrow{letter-spacing:.1em}
.ratecard .v{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,12,8,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:680px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.wide{max-width:900px}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.mh h3{font-size:24px}
.mb{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 20px;flex-wrap:wrap}
.xbtn{border:0;background:none;font-size:22px;line-height:1;padding:4px 8px;color:var(--muted)}
.preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--sunk);border-radius:var(--r);padding:12px}
.preview .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.preview .v{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.picklist{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r)}
.pick{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.pick:last-child{border-bottom:0}
.pick input{width:auto;flex:none}
.th{width:44px;height:44px;border-radius:5px;object-fit:cover;flex:none;background:var(--sunk);border:1px solid var(--line);display:block;cursor:zoom-in}
.th-ph{width:44px;height:44px;border-radius:5px;flex:none;background:var(--sunk);border:1px dashed var(--line);display:grid;place-items:center;color:var(--sand);font-family:var(--f-display);font-size:18px}
.th.sm,.th-ph.sm{width:32px;height:32px;font-size:14px}
.pz{display:flex;gap:10px;align-items:center;min-width:0}
.pz>div{min-width:0}
.photo-field{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:460px){.photo-field{grid-template-columns:minmax(0,1fr)}}
.ph{aspect-ratio:1;max-width:100%;border-radius:var(--r);border:1px dashed var(--sand);background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.lightbox{display:flex;justify-content:center;background:var(--sunk);border-radius:var(--r);min-height:200px;align-items:center}
.lightbox img{max-width:100%;max-height:70vh;border-radius:var(--r);display:block}
.pick .d{flex:1;min-width:0}
.pick .p{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.sumbar{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;padding:10px 12px;background:var(--sunk);border-radius:var(--r)}
.sumbar b{font-variant-numeric:tabular-nums}
.venta{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.venta .vh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;background:var(--sunk)}
.venta .vb{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.mini{font-size:12.5px}
.mini td,.mini th{padding:7px 9px}
.brand .logo-img{height:52px;width:auto;max-width:150px;object-fit:contain;flex:none;display:block}
.lockbtn{padding:8px 12px;font-size:12px}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-y:auto}
.gate-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:30px 26px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate-card .mark{display:flex;justify-content:center}
.gate-card .mark svg{width:84px;height:70px}
.gate-card .mark img{max-height:90px;max-width:220px;object-fit:contain}
.gate-card h2{font-size:24px}
.gate-card input{text-align:center;font-size:18px;letter-spacing:.3em}
.gate-err{color:var(--bad);font-size:13px;min-height:1.2em;margin:0}
.conv{background:var(--sunk);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:14px}
.conv .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.conv .row>*{flex:1 1 150px;min-width:0}
.links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.links a{color:var(--gold);font-weight:600}
.warnline{color:var(--warn);font-size:12.5px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.hint{font-size:12.5px;color:var(--muted)}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.6}}}
</style>
</head>

function codeArt(tipo){let m=0;Object.values(S.art).forEach(x=>{const n=parseInt((String(x.codigo||'').match(/(\d+)\s*$/)||[])[1]);if(n>m)m=n});return 'AUR-'+(FAM[tipo]||'OTR')+'-'+pad(m+1,3)}
const grams=n=>fmt(n)+' g';

function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)}
function pd(s){const [y,m,d]=String(s||today()).split('-').map(Number);return new Date(y,(m||1)-1,d||1)}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)}
function fdate(s){if(!s)return '—';const d=pd(s);return pad(d.getDate(),2)+'/'+pad(d.getMonth()+1,2)+'/'+d.getFullYear()}
function addPeriod(s,freq,k){const d=pd(s);
  if(freq==='semanal'){d.setDate(d.getDate()+7*k);return iso(d)}
  if(freq==='quincenal'){d.setDate(d.getDate()+15*k);return iso(d)}
  const day=d.getDate(), t=new Date(d.getFullYear(),d.getMonth()+k,1);
  const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); t.setDate(Math.min(day,last)); return iso(t)}
const ym=s=>String(s||'').slice(0,7);

/* precios: todo sale del precio del oro por gramo
   costo de reposición = peso × oro/g + hechura · contado = costo × (1+margen) · crédito = contado × (1+recargo) */
const costoRef=a=>r2((+a.peso||0)*(+T().oro||0)+(+a.hechura||0));
const costoArt=a=>(+a.costoReal>0)?r2(a.costoReal):costoRef(a);
const pContado=a=>r2(costoRef(a)*(1+(+T().margen||0)/100));
const pCredito=a=>r2(pContado(a)*(1+(+T().recargo||0)/100));

/* plan de cuotas */
function plan(v){
  const ab=sum((v.abonos||[]).map(a=>a.monto));
  const pagado=r2((+v.inicial||0)+ab);
  const saldo=Math.max(0,r2(v.total-pagado));
  const res={ab,pagado,saldo,cuotas:[],vencido:0,prox:null,estado:'pagada'};
  if(v.modalidad==='contado'){res.estado=saldo<=0.005?'pagada':'pendiente';return res}
  const fin=r2(v.total-(+v.inicial||0)), n=Math.max(1,parseInt(v.cuotas)||1);
  const base=Math.floor(fin/n*100)/100; let rest=ab; const hoy=today();
  for(let k=1;k<=n;k++){
    const monto=k<n?base:r2(fin-base*(n-1)), fecha=addPeriod(v.fecha,v.frecuencia,k);
    const pag=Math.min(rest,monto); rest=r2(rest-pag);
    const st=pag>=monto-0.005?'pagada':(fecha<hoy?'vencida':'pendiente');
    if(st==='vencida')res.vencido=r2(res.vencido+monto-pag);
    if(!res.prox&&st!=='pagada')res.prox={k,fecha,monto:r2(monto-pag)};
    res.cuotas.push({k,fecha,monto,pag:r2(pag),st});
  }
  res.estado=saldo<=0.005?'pagada':(res.vencido>0.005?'atrasada':'aldia');
  return res;
}
const chipEstado=e=>({pagada:'<span class="chip c-ok">Pagada</span>',aldia:'<span class="chip c-ok">Al día</span>',atrasada:'<span class="chip c-bad">Atrasada</span>',pendiente:'<span class="chip c-warn">Pendiente</span>',vencida:'<span class="chip c-bad">Vencida</span>'}[e]||'');
const ventasDe=cid=>Object.values(S.ven).filter(v=>v.clienteId===cid).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
function resumenCliente(cid){
  const vs=ventasDe(cid); let saldo=0,venc=0,total=0,prox=null,atr=false;
  vs.forEach(v=>{const p=plan(v);saldo+=p.saldo;venc+=p.vencido;total+=v.total;if(p.estado==='atrasada')atr=true;
    if(p.prox&&(!prox||p.prox.fecha<prox.fecha))prox=p.prox});
  return {vs,saldo:r2(saldo),venc:r2(venc),total:r2(total),prox,estado:!vs.length?'sin':(saldo<=0.005?'pagada':(atr?'atrasada':'aldia'))};
}
function nextCode(prefix,col,field){let m=0;Object.values(S[col]).forEach(x=>{const n=parseInt(String(x[field]||'').replace(/\D/g,''));if(n>m)m=n});return prefix+pad(m+1)}

/* ============ Persistencia ============ */
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({tarifa:S.tarifa,acc:S.acc,marca:S.marca,art:S.art,cli:S.cli,ven:S.ven}))}catch(e){toast('No se pudo guardar en el teléfono: memoria del navegador llena. Descarga un respaldo.')}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(d){S.tarifa=d.tarifa||null;S.acc=d.acc||null;S.marca=d.marca||null;S.art=d.art||{};S.cli=d.cli||{};S.ven=d.ven||{}}}catch(e){}}
function fail(e){const c=e&&e.code;
  if(c==='invalid_argument'){canWrite=false;toast('No tienes permiso para guardar cambios en esta página.');render();return}
  if(c==='quota_exceeded'){toast('Se llenó el espacio de datos. Descarga un respaldo y elimina registros viejos.');return}
  toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.')}
async function put(k,data){
  if(!canWrite){toast('Esta vista es solo de lectura.');return false}
  const id=data.id; data.actualizado=new Date().toISOString();
  S[k]={...S[k],[id]:data}; render();
  if(DB){try{await DB.collection(COL[k]).doc(id).set(JSON.parse(JSON.stringify(data)))}catch(e){fail(e);return false}} else saveLocal();
  return true}
async function del(k,id){
  if(!canWrite){toast('Esta vista es solo de lectura.');return}
  const n={...S[k]};delete n[id];S[k]=n;render();
  if(DB){try{await DB.collection(COL[k]).doc(id).delete()}catch(e){fail(e)}} else saveLocal()}
async function putConfig(key,data){
  if(!canWrite){toast('Esta vista es solo de lectura.');return false}
  S[key==='acceso'?'acc':key]=data;render();
  if(DB){try{await DB.doc('config/'+key).set(JSON.parse(JSON.stringify(data)))}catch(e){fail(e);return false}} else saveLocal();
  return true}
async function putTarifa(t){
  if(!canWrite){toast('Esta vista es solo de lectura.');return false}
  S.tarifa=t;render();
  if(DB){try{await DB.doc('config/tarifa').set(JSON.parse(JSON.stringify(t)))}catch(e){fail(e);return false}} else saveLocal();
  return true}

/* ============ Render ============ */
function render(){
  const t=T();
  paintLogo();
  document.getElementById('rateChip').innerHTML=S.tarifa&&t.oro>0
    ? `<span class="muted">Oro 18K</span><span><b class="num">${money(t.oro)}/g</b></span><span>Margen <b class="num">${pct(t.margen)}</b></span><span>Crédito <b class="num">+${pct(t.recargo)}</b></span>${t.tasa>0?`<span>Tasa <b class="num">Bs. ${fmt(t.tasa)}</b></span>`:''}<span class="muted num">${fdate(t.fecha)}</span>`
    : `<span><b>Fija el precio del oro por gramo</b> para calcular precios</span>`;
  document.getElementById('lockBtn').hidden=!S.acc;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===TAB));
  const bn=[];
  let ult=null;try{ult=localStorage.getItem('aure-ultimo-respaldo')}catch(e){}
  const dias=ult?Math.floor((pd(today())-pd(ult))/864e5):null;
  const bnAct=[];
  if(dias===null||dias>=7)bnAct.push(`${dias===null?'Aún no has descargado ningún respaldo.':'Último respaldo hace '+dias+' días.'} Los datos viven solo en este teléfono: guarda un respaldo en WhatsApp, Drive o correo. <button class="btn-sm" data-act="backup" style="margin-left:6px">Descargar respaldo</button>`);
  if(!canWrite)bn.push('Vista de solo lectura: puedes consultar, pero no guardar cambios.');
  document.getElementById('banner').innerHTML=bn.map(x=>`<div class="banner">${esc(x)}</div>`).join('')+bnAct.map(x=>`<div class="banner">${x}</div>`).join('');
  const v=document.getElementById('view');
  if(S.loaded&&!UNLOCKED){v.innerHTML='';return}
  if(!S.loaded){v.innerHTML='<div class="empty">Cargando registros…</div>';return}
  v.innerHTML=({resumen:vResumen,inventario:vInventario,clientes:vClientes,ventas:vVentas,tarifa:vTarifa}[TAB])();
  if(TAB==='tarifa')tarifaPreview();
  if(OPEN_FICHA&&S.cli[OPEN_FICHA]&&document.getElementById('modalRoot').dataset.kind==='ficha')openFicha(OPEN_FICHA,true);
}

  const arts=Object.values(S.art), disp=arts.filter(a=>a.estado!=='vendido');
  const g=sum(disp.map(a=>a.peso)), vc=sum(disp.map(costoArt)), vco=sum(disp.map(pContado)), vcr=sum(disp.map(pCredito));
  const vens=Object.values(S.ven); let cxc=0,venc=0,nAtr=0; const proximos=[];
  const mes=ym(today()); let vMes=0,cMes=0,uMes=0;
  vens.forEach(v=>{const p=plan(v);cxc+=p.saldo;venc+=p.vencido;if(p.estado==='atrasada')nAtr++;
    if(ym(v.fecha)===mes){vMes+=v.total;uMes+=v.total-(+v.costoTotal||0);cMes+=(+v.inicial||0)}
    (v.abonos||[]).forEach(a=>{if(ym(a.fecha)===mes)cMes+=(+a.monto||0)});
    p.cuotas.filter(c=>c.st!=='pagada').slice(0,2).forEach(c=>proximos.push({v,c}))});
  const lim=iso(new Date(Date.now()+14*864e5));
  const cola=proximos.filter(x=>x.c.fecha<=lim).sort((a,b)=>a.c.fecha.localeCompare(b.c.fecha)).slice(0,12);
  const nombreMes=new Date().toLocaleDateString('es-VE',{month:'long',year:'numeric'});
  return `
  <div class="head"><div><div class="eyebrow">Resumen general</div><h2>Así está el negocio hoy</h2></div>
    <div class="tools"><button class="btn-gold" data-act="new-art">+ Registrar compra</button><button data-act="new-venta">+ Nueva venta</button></div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Inventario disponible</div><div class="v">${disp.length} piezas</div><div class="s num">${grams(g)} de oro 18K</div></div>

const thumbHtml=(a,sm)=>a&&a.thumb?`<img class="th${sm?' sm':''}" src="${a.thumb}" alt="Foto de ${esc(a.descripcion)}" data-act="foto" data-id="${a.id}">`:`<span class="th-ph${sm?' sm':''}" aria-hidden="true">${esc(((a&&a.tipo)||'·').charAt(0))}</span>`;
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=u})}
function toJpeg(img,max,q){const w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
async function procesarImagen(file){
  const img=await loadImg(file); let max=1100,q=.82,full=toJpeg(img,max,q);
  while(full.length>200000&&(q>.5||max>600)){if(q>.5)q-=.08;else max-=150;full=toJpeg(img,max,q)}
  return {full,thumb:toJpeg(img,180,.72)}}
const IDB_NAME='aure-fotos';
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbDo(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('fotos',mode),st=tx.objectStore('fotos');const q=fn(st);tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)})}
async function putFoto(id,data){FOTO[id]=data;
  try{await idbDo('readwrite',st=>st.put(data,id));return true}catch(e){toast('No se pudo guardar la foto en el teléfono.');return false}}
async function delFoto(id){delete FOTO[id];try{await idbDo('readwrite',st=>st.delete(id))}catch(e){}}
async function getFoto(id){if(FOTO[id])return FOTO[id];
  try{const v=await idbDo('readonly',st=>st.get(id));if(v){FOTO[id]=v;return v}}catch(e){}
  return null}
async function verFoto(id){const a=S.art[id];if(!a)return;const back=OPEN_FICHA;

  OPEN_FICHA=back;const f=await getFoto(id);const i=document.getElementById('lbImg');if(f&&i)i.src=f}

function fotoPaint(){const ph=document.getElementById('aPh');if(!ph||!AF)return;
  ph.innerHTML=AF.busy?'Procesando…':(AF.thumb?`<img id="aPhImg" src="${AF.full||AF.thumb}" alt="Foto de la pieza">`:'Sin foto');
  const b=document.getElementById('aFotoBtn');if(b)b.firstChild.textContent=AF.thumb?'Cambiar foto':'Adjuntar foto';
  const q=document.getElementById('aFotoQuitar');if(q)q.hidden=!AF.thumb}
function openModal(html,kind='',wide=false){const r=document.getElementById('modalRoot');r.dataset.kind=kind;
  r.innerHTML=`<div class="ov" data-act="ov"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=r.querySelector('input:not([type=checkbox]):not([type=search]),select');if(f&&!wide)setTimeout(()=>f.focus(),30)}
function closeModal(){const r=document.getElementById('modalRoot');r.innerHTML='';r.dataset.kind='';OPEN_FICHA=null;AF=null}
const mh=(t,e)=>`<div class="mh"><div>${e?`<div class="eyebrow">${e}</div>`:''}<h3>${t}</h3></div><button class="xbtn" type="button" data-act="close" aria-label="Cerrar">×</button></div>`;

    ${fotoField(a)}

      <label class="f">Peso en gramos <input id="aPeso" name="peso" type="number" step="0.01" min="0.01" inputmode="decimal" required value="${a.peso}" ${sold?'readonly':''}></label>
      <label class="f">Hechura / merma (USD) <input id="aHech" name="hechura" type="number" step="0.01" min="0" inputmode="decimal" value="${a.hechura??''}" ${sold?'readonly':''}></label>
      <label class="f">Proveedor <input id="aProv" name="proveedor" maxlength="80" value="${esc(a.proveedor)}"></label>
      <label class="f">Fecha de compra <input id="aFecha" name="fechaCompra" type="date" value="${a.fechaCompra||today()}"></label>
      <label class="f" style="grid-column:1/-1">Costo real pagado (USD) <small>Opcional, para calcular tu utilidad real. Si lo dejas vacío se usa peso × oro/g + hechura.</small><input id="aCostoReal" name="costoReal" type="number" step="0.01" min="0" inputmode="decimal" value="${+a.costoReal>0?a.costoReal:''}"></label>

function artPreview(){const b=document.getElementById('aPrev');if(!b)return;

  const h=n=>bs(1)?`<div class="hint">${bs(n)}</div>`:'';
  b.innerHTML=`<div><div class="l">Costo</div><div class="v">${money(costoArt(a))}</div>${h(costoArt(a))}</div><div><div class="l">Contado</div><div class="v">${money(pContado(a))}</div>${h(pContado(a))}</div><div><div class="l">Crédito</div><div class="v">${money(pCredito(a))}</div>${h(pCredito(a))}</div>`}

let VF=null; // estado del formulario de venta

  if(!disp.length){toast('No hay piezas disponibles. Registra una compra primero.');return}
  VF={sel:new Set(),modalidad:'credito',totalManual:false,q:''};
  openModal(`<form data-form="venta">${mh('Nueva venta','Ventas')}
  <div class="mb">
    <div class="grid g2">
      <label class="f">Cliente <select id="vCli" name="clienteId" required><option value="">Selecciona…</option>${cs.map(c=>`<option value="${c.id}" ${c.id===clienteId?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></label>
      <label class="f">Fecha de venta <input id="vFecha" name="fecha" type="date" value="${today()}" required></label>
    </div>
    <div class="tools" style="justify-content:space-between"><button type="button" class="btn-sm btn-ghost" data-act="new-cli-v">+ Cliente nuevo</button>
      <div class="seg"><button type="button" data-act="v-mod" data-m="credito" aria-pressed="true">A crédito</button><button type="button" data-act="v-mod" data-m="contado" aria-pressed="false">De contado</button></div></div>
    <div><input id="vQ" type="search" placeholder="Buscar pieza disponible" style="margin-bottom:8px">
    <div class="picklist" id="vPick">${disp.map(a=>`<label class="pick" data-q="${esc((a.codigo+' '+a.descripcion+' '+a.tipo).toLowerCase())}"><input type="checkbox" value="${a.id}" data-act="v-pick">${thumbHtml(a,1).replace('data-act="foto"','')}<span class="d"><span class="code">${esc(a.codigo)}</span> ${esc(a.descripcion)}<div class="hint">${grams(a.peso)}</div></span><span class="p" data-pc="${pContado(a)}" data-pr="${pCredito(a)}">${money(pCredito(a))}</span></label>`).join('')}</div></div>
    <div class="sumbar" id="vSum"></div>
    <div class="grid g4" id="vPlan">
      <label class="f">Total pactado <input id="vTotal" name="total" type="number" step="0.01" min="0" inputmode="decimal"></label>
      <label class="f">Inicial <input id="vIni" name="inicial" type="number" step="0.01" min="0" inputmode="decimal" value="0"></label>
      <label class="f">N.º de cuotas <input id="vCuotas" name="cuotas" type="number" min="1" max="60" step="1" value="4"></label>
      <label class="f">Frecuencia <select id="vFreq" name="frecuencia"><option value="semanal">Semanal</option><option value="quincenal" selected>Quincenal</option><option value="mensual">Mensual</option></select></label>
    </div>
    <div id="vCuotasPrev"></div>
    <label class="f">Notas de la venta <textarea id="vNotas" name="notas" maxlength="300"></textarea></label>
  </div>
  <div class="mf"><button type="button" data-act="close">Cancelar</button><button class="btn-gold" type="submit">Registrar venta</button></div></form>`,'venta',true);
  ventaRecalc();
}
function ventaItems(){return [...VF.sel].map(id=>S.art[id]).filter(Boolean)}
function ventaRecalc(){
  if(!VF)return; const items=ventaItems(), credito=VF.modalidad==='credito';
  document.querySelectorAll('#vPick .p').forEach(p=>p.textContent=money(+p.dataset[credito?'pr':'pc']));
  const sub=sum(items.map(credito?pCredito:pContado)), g=sum(items.map(a=>a.peso)), cost=sum(items.map(costoArt));
  const tI=document.getElementById('vTotal'); if(!VF.totalManual)tI.value=sub?sub.toFixed(2):'';
  const total=+tI.value||0;
  document.getElementById('vSum').innerHTML=`<span>${items.length} ${items.length===1?'pieza':'piezas'}</span><span>${grams(g)}</span><span>Precio ${credito?'crédito':'contado'}: <b>${money(sub)}</b></span>${total&&total!==sub?`<span>Ajuste: <b>${money(total-sub)}</b></span>`:''}<span>Utilidad: <b>${money(total-cost)}</b></span>`;
  ['vCuotas','vFreq','vIni'].forEach(i=>document.getElementById(i).closest('label').hidden=!credito);
  const box=document.getElementById('vCuotasPrev');
  if(!credito||!total){box.innerHTML='';return}
  const v={modalidad:'credito',total,inicial:+document.getElementById('vIni').value||0,cuotas:+document.getElementById('vCuotas').value||1,frecuencia:document.getElementById('vFreq').value,fecha:document.getElementById('vFecha').value,abonos:[]};
  if(v.inicial>total){box.innerHTML='<p class="hint" style="color:var(--bad)">La inicial no puede superar el total.</p>';return}
  const p=plan(v);
  box.innerHTML=`<div class="hint" style="margin-bottom:6px">Plan: ${p.cuotas.length} cuotas ${freqTxt(v.frecuencia)} de ${money(p.cuotas[0]?p.cuotas[0].monto:0)} · financiado ${money(total-v.inicial)}</div>
  <div class="scroll"><table class="mini panel"><thead><tr><th>Cuota</th><th>Vence</th><th class="r">Monto</th></tr></thead><tbody>${p.cuotas.map(c=>`<tr><td>${c.k}</td><td class="num">${fdate(c.fecha)}</td><td class="r">${money(c.monto)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ============ Estado de cuenta ============ */
function edoTexto(cid){const c=S.cli[cid],r=resumenCliente(cid);
  const L=[`AURE · Estado de cuenta`,`Cliente: ${c.nombre}`,`Fecha: ${fdate(today())}`,''];
  r.vs.forEach(v=>{const p=plan(v);if(p.saldo<=0.005&&r.vs.length>1)return;
    L.push(`${v.numero} (${fdate(v.fecha)}): ${v.items.map(i=>i.descripcion).join(', ')}`);
    L.push(`Total ${money(v.total)} · Pagado ${money(p.pagado)} · Saldo ${money(p.saldo)}`);
    if(p.vencido>0.005)L.push(`Vencido: ${money(p.vencido)}`);
    if(p.prox)L.push(`Próxima cuota: ${fdate(p.prox.fecha)} · ${money(p.prox.monto)}`);L.push('')});
  L.push(`Saldo total: ${money(r.saldo)}${bs(1)?` (${bs(r.saldo)} a tasa del día)`:''}`,'','Gracias por tu confianza. AURE · Luz que se lleva puesta');return L.join('\n')}

  const rows=r.vs.map(v=>{const p=plan(v);return `<h3>${esc(v.numero)} · ${fdate(v.fecha)} · ${v.modalidad==='contado'?'Contado':v.cuotas+' cuotas '+freqTxt(v.frecuencia)}</h3>
  <table><tr><th>Pieza</th><th>Peso</th><th>Precio</th></tr>${v.items.map(i=>{const ar=S.art[i.id];return `<tr><td>${ar&&ar.thumb?`<img src="${ar.thumb}" alt="" style="width:40px;height:40px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:8px">`:''}${esc(i.codigo)} ${esc(i.descripcion)}</td><td>${grams(i.peso)}</td><td>${money(i.precio)}</td></tr>`}).join('')}</table>
  <p>Total <b>${money(v.total)}</b> · Inicial ${money(v.inicial)} · Abonos ${money(p.ab)} · <b>Saldo ${money(p.saldo)}</b>${p.vencido>0.005?' · Vencido '+money(p.vencido):''}</p>
  ${p.cuotas.length?`<table><tr><th>Cuota</th><th>Vence</th><th>Monto</th><th>Pagado</th></tr>${p.cuotas.map(q=>`<tr><td>${q.k}</td><td>${fdate(q.fecha)}</td><td>${money(q.monto)}</td><td>${money(q.pag)}</td></tr>`).join('')}</table>`:''}
  ${(v.abonos||[]).length?`<table><tr><th>Abono</th><th>Forma de pago</th><th>Monto</th></tr>${v.abonos.map(a=>`<tr><td>${fdate(a.fecha)}</td><td>${esc(a.metodo)} ${esc(a.ref||'')}</td><td>${money(a.monto)}</td></tr>`).join('')}</table>`:''}`}).join('');

async function save(filename,data){
  try{const type=filename.endsWith('.csv')?'text/csv;charset=utf-8':filename.endsWith('.html')?'text/html;charset=utf-8':'application/json';
    const file=new File([data],filename,{type});
    if(filename.endsWith('.json')&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return true}catch(e){if(e&&e.name==='AbortError')return false}}
    const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return true}
  catch(e){toast('No se pudo descargar el archivo.');return false}}
function csv(){
  const head=['Codigo','Nombre','Categoria','Acabado','Peso_g','Hechura_USD','Costo_USD','PVP_contado_USD','PVP_credito_USD','PVP_contado_Bs','Estado'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=Object.values(S.art).sort((a,b)=>(a.codigo||'').localeCompare(b.codigo||'')).map(a=>[a.codigo,a.descripcion,a.tipo,a.acabado,(+a.peso).toFixed(2),(+a.hechura||0).toFixed(2),costoArt(a).toFixed(2),pContado(a).toFixed(2),pCredito(a).toFixed(2),(pContado(a)*(+T().tasa||0)).toFixed(2),a.estado==='vendido'?'Vendido':'Disponible'].map(q).join(';'));
  save(`AURE-inventario-${today()}.csv`,'﻿'+[head.join(';'),...rows].join('\n'))}
async function backup(){toast('Preparando respaldo con fotos…');const fotos={};
  for(const a of Object.values(S.art))if(a.thumb){const f=await getFoto(a.id);if(f)fotos[a.id]=f}
  const okB=await save(`AURE-respaldo-${today()}.json`,JSON.stringify({app:'AURE control oro',version:2,fecha:new Date().toISOString(),tarifa:S.tarifa,articulos:Object.values(S.art),clientes:Object.values(S.cli),ventas:Object.values(S.ven),fotos}));if(okB!==false){try{localStorage.setItem('aure-ultimo-respaldo',today())}catch(e){}render()}}
async function restore(file){
  try{const d=JSON.parse(await file.text());if(d.app!=='AURE control oro')throw 0;
    toast('Restaurando respaldo…');
    if(d.tarifa)await putTarifa(d.tarifa);
    for(const a of d.articulos||[])await put('art',a);

const SS_KEY='aure-unlock';
let UNLOCKED=false, FAILS=0, WAIT_UNTIL=0, IDLE_T=null;
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let MEM_HASH=null;
function ssGet(){try{return sessionStorage.getItem(SS_KEY)||MEM_HASH}catch(e){return MEM_HASH}}
function ssSet(v){MEM_HASH=v||null;try{v?sessionStorage.setItem(SS_KEY,v):sessionStorage.removeItem(SS_KEY)}catch(e){}}
function logoHtml(big){return S.marca&&S.marca.logo?`<img class="${big?'':'logo-img'}" src="${S.marca.logo}" alt="AURE">`:document.getElementById('logoDefault')?document.getElementById('logoDefault').outerHTML.replace('id="logoDefault"',''):''}
function paintLogo(){const slot=document.getElementById('logoSlot');if(!slot)return;const has=!!(S.marca&&S.marca.logo);
  const cur=slot.querySelector('img.logo-img');
  if(has){if(!cur||cur.getAttribute('src')!==S.marca.logo){const d=document.getElementById('logoDefault');if(d)d.hidden=true;if(cur)cur.remove();slot.insertAdjacentHTML('beforeend',`<img class="logo-img" src="${S.marca.logo}" alt="AURE">`)}
    const wm=document.querySelector('.brand .wm');if(wm)wm.hidden=true}
  else{if(cur)cur.remove();const d=document.getElementById('logoDefault');if(d)d.hidden=false;const wm=document.querySelector('.brand .wm');if(wm)wm.hidden=false}}
async function subirLogo(file){
  try{const img=await loadImg(file);const max=420,k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const png=file.type==='image/jpeg'?c.toDataURL('image/jpeg',.9):c.toDataURL('image/png');
    if(await putConfig('marca',{logo:png}))toast('Logo actualizado.')}catch(e){toast('No se pudo leer la imagen del logo.')}}
function showGate(mode){
  const g=document.getElementById('gate');document.querySelector('.wrap').hidden=true;closeModal();
  g.hidden=false;
  g.innerHTML=`<form class="gate-card" data-gate="${mode}">
    <div class="mark">${logoHtml(true)}</div>
    <div><div class="eyebrow">AURE · Control de oro 18K</div><h2>${mode==='crear'?'Crea tu clave de acceso':'Ingresa tu clave'}</h2></div>
    ${mode==='crear'?'<p class="hint" style="margin:0">Se pedirá cada vez que abras la app. Mínimo 4 caracteres.</p>':''}
    <input id="gPin" type="password" autocomplete="${mode==='crear'?'new-password':'current-password'}" aria-label="Clave" required>
    ${mode==='crear'?'<input id="gPin2" type="password" autocomplete="new-password" aria-label="Repite la clave" placeholder="Repite la clave" required>':''}
    <p class="gate-err" id="gErr"></p>
    <button class="btn-gold" type="submit">${mode==='crear'?'Guardar clave y entrar':'Entrar'}</button>
  </form>`;
  setTimeout(()=>{const i=document.getElementById('gPin');if(i)i.focus()},40)}
async function gateSubmit(){
  const f=document.querySelector('#gate form'),err=document.getElementById('gErr');if(!f)return;
  const pin=document.getElementById('gPin').value;
  if(f.dataset.gate==='crear'){
    const p2=document.getElementById('gPin2').value;
    if(pin.length<4){err.textContent='La clave debe tener al menos 4 caracteres.';return}
    if(pin!==p2){err.textContent='Las claves no coinciden.';return}
    const salt=uid()+uid(),hash=await sha(salt+pin);ssSet(hash);
    if(!await putConfig('acceso',{salt,hash,creado:new Date().toISOString()})){ssSet(null);err.textContent='No se pudo guardar la clave.';return}
    unlock();toast('Clave creada.');return}
  if(Date.now()<WAIT_UNTIL){err.textContent=`Demasiados intentos. Espera ${Math.ceil((WAIT_UNTIL-Date.now())/1000)} s.`;return}
  const hash=await sha(S.acc.salt+pin);
  if(hash===S.acc.hash){FAILS=0;ssSet(hash);unlock();return}
  FAILS++;if(FAILS>=5){WAIT_UNTIL=Date.now()+30000;FAILS=0}
  err.textContent='Clave incorrecta.';document.getElementById('gPin').value='';document.getElementById('gPin').focus()}
function unlock(){UNLOCKED=true;const g=document.getElementById('gate');g.hidden=true;g.innerHTML='';document.querySelector('.wrap').hidden=false;render();bumpIdle()}
function lockApp(){UNLOCKED=false;ssSet(null);showGate('entrar')}
function bumpIdle(){clearTimeout(IDLE_T);if(UNLOCKED&&S.acc)IDLE_T=setTimeout(lockApp,20*60*1000)}
['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(UNLOCKED)bumpIdle()},{passive:true}));
function checkGate(){
  if(!S.loaded)return;
  if(!S.acc){if(!UNLOCKED)showGate('crear');return}
  if(UNLOCKED&&ssGet()!==S.acc.hash){lockApp();return}
  if(!UNLOCKED){if(ssGet()===S.acc.hash)unlock();else if(document.getElementById('gate').hidden)showGate('entrar')}
}

async function init(){
  document.querySelector('.wrap').hidden=false;render();document.querySelector('.wrap').hidden=true;
  document.getElementById('gate').hidden=false;document.getElementById('gate').innerHTML='<div class="gate-card"><div class="mark">'+logoHtml(true)+'</div><p class="hint" style="margin:0">Cargando…</p></div>';
  MODE='local';loadLocal();
  if(!Object.keys(S.art).length&&!S.tarifa){S.tarifa=SEED.tarifa;S.art=SEED.art;saveLocal()}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  S.loaded=true;render();checkGate();
}
init();
</script>
